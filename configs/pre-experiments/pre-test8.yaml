game_id: pre-test8-shang-vs-random-baselines
experiment_id: pre-test
seed: 42
# pre test8
# Shang vs 3 * fully random baseline AI
# court roles all DeepSeek-V4-Flash; baselines are pure random (no LLM)
# total rounds: 50

players:
  - player_id: shang-court
    seat: 4
    controller_type: shang_court
    court_role_profiles:
      great_priest: shang-great-priest
      emperor: shang-emperor
  - player_id: baseline-1
    seat: 1
    controller_type: random_baseline
  - player_id: baseline-2
    seat: 2
    controller_type: random_baseline
  - player_id: baseline-3
    seat: 3
    controller_type: random_baseline

model_profiles:
  shang-great-priest:
    provider: openai_compatible
    base_url: https://llmapi.paratera.com/
    api_key_env: MONOPOLY_API_KEY2
    model: DeepSeek-V4-Flash
    seed: 42
    temperature: 0.2
    max_tokens: 500
    timeout_seconds: 60

  shang-emperor:
    provider: openai_compatible
    base_url: https://llmapi.paratera.com/
    api_key_env: MONOPOLY_API_KEY2
    model: DeepSeek-V4-Flash
    seed: 42
    temperature: 0.2
    max_tokens: 500
    timeout_seconds: 60

initial_cash: 1500
max_complete_rounds: 50
initial_chance_cards: 2
rules_version: classic-level0-v1
rules_level: 0
