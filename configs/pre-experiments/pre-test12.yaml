game_id: pre-test12-ming-vs-baselines
experiment_id: pre-test
seed: 42
# pre test12
# Ming mixed-model court vs 3 * baseline AI
# baselines all DeepSeek-V4-Flash
# court departments: chief_grand_secretary DeepSeek-V4-Flash / grand_secretary_1 GLM-5-Turbo / grand_secretary_2 Qwen3.7-Plus / emperor Kimi-K2.6
# total rounds: 50

players:
  - player_id: ming-court
    seat: 4
    controller_type: ming_court
    court_role_profiles:
      chief_grand_secretary: ming-chief-grand-secretary
      grand_secretary_1: ming-grand-secretary-1
      grand_secretary_2: ming-grand-secretary-2
      emperor: ming-emperor
  - player_id: baseline-1
    seat: 1
    controller_type: llm_baseline
    model_profile: baseline-model-1
  - player_id: baseline-2
    seat: 2
    controller_type: llm_baseline
    model_profile: baseline-model-2
  - player_id: baseline-3
    seat: 3
    controller_type: llm_baseline
    model_profile: baseline-model-3

model_profiles:
  ming-chief-grand-secretary:
